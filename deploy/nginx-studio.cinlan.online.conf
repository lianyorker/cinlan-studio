log_format cinlan_studio_no_args '$remote_addr - $remote_user [$time_local] '
                                 '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name studio.cinlan.online;
    access_log /var/log/nginx/studio.cinlan.online.access.log cinlan_studio_no_args;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.cinlan.online;
    access_log /var/log/nginx/studio.cinlan.online.access.log cinlan_studio_no_args;

    ssl_certificate /etc/letsencrypt/live/studio.cinlan.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.cinlan.online/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
